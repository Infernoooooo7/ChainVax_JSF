# Docker mode: PostgreSQL 17 + Redis 7 for the "postgres" and "redis" Spring profiles.
# Easiest:  start-demo.cmd docker        (or docker-reset for fresh data)
# Manually: docker compose up -d --wait
#           java -jar backend/target/chainvax.jar --spring.profiles.active=postgres,redis
# Verified on Docker Desktop (engine 29.9.2) on 6 Nov 2026. Credentials are local demo values.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: chainvax
      POSTGRES_USER: chainvax
      POSTGRES_PASSWORD: chainvax
    ports:
      - "5432:5432"
    volumes:
      - chainvax-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainvax -d chainvax"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  chainvax-pg:
